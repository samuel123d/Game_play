<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070917" />
    <meta name="description" content="Desafio Relâmpago — Jogo educativo interativo sobre cadastro seguro." />
    <title>Desafio Relâmpago · Conexão</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <a class="brand" href="./" aria-label="Conexão, início do Desafio Relâmpago">
          <span class="brand-mark" aria-hidden="true"><span></span></span>
          <span>CONEXÃO<span class="brand-dot">.</span></span>
        </a>
        <div class="topbar-center">
          <span class="live-dot" aria-hidden="true"></span>
          <span>DESAFIO RELÂMPAGO · AO VIVO</span>
        </div>
        <div class="topbar-actions">
          <button class="icon-button" id="audioToggle" type="button" aria-pressed="false">
            <span>♫ Som desligado</span>
          </button>
          <button class="icon-button" id="fullscreenToggle" type="button" title="Tela cheia (F)">
            <span>Tela cheia</span>
          </button>
        </div>
      </header>

      <section class="presentation" aria-label="Palco do Desafio Relâmpago">
        <div class="ambient ambient-one" aria-hidden="true"></div>
        <div class="ambient ambient-two" aria-hidden="true"></div>
        <div class="grid-glow" aria-hidden="true"></div>

        <div class="stage-wrap">
          <div class="stage" id="stage">
            <div id="gameContent" class="game-container"></div>
          </div>
        </div>

        <footer class="host-bar" id="hostBar">
          <div class="host-status" id="hostStatus">Pronto para abrir uma nova sala.</div>
          <div class="host-actions" id="hostActions"></div>
        </footer>
      </section>
    </main>

    <script src="./qr.js"></script>
    <script src="./avatar.js"></script>
    <script src="./game-audio.js"></script>
    <script type="module" src="./host.js"></script>
  </body>
</html>
