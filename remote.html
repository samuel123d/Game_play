<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080a18" />
    <title>Controle do Jogo · Conexão</title>
    <link rel="stylesheet" href="./remote.css" />
  </head>
  <body class="remote-body">
    <main class="remote-shell">
      <header class="remote-header">
        <a class="remote-brand" href="./">CONEXÃO<span>.</span></a>
        <span class="remote-connection" id="connectionStatus"><i></i> CONECTANDO</span>
      </header>

      <section class="pair-card" id="pairCard">
        <p class="remote-eyebrow">EMPARELHAR CONTROLE</p>
        <h1>Controle o jogo<br /><span>pelo celular.</span></h1>
        <p class="pair-copy">Digite o PIN de 6 dígitos exibido no botão “Controle” do telão.</p>
        <form id="pairForm">
          <label for="pairCode">CÓDIGO DE CONEXÃO</label>
          <div class="pin-entry">
            <input id="pairCode" name="pin" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="000000" required />
            <button type="submit">Conectar <span>→</span></button>
          </div>
          <p class="pair-error" id="pairError" role="alert"></p>
        </form>
      </section>

      <section class="controller" id="controller" hidden>
        <section class="remote-section room-game-controls" id="roomGameControls" aria-label="Comandos do Jogo">
          <div class="section-heading"><span>COMANDO DO QUIZ</span><span>AO VIVO</span></div>
          <h2 id="roomGameTitle">Desafio relâmpago</h2>
          <p class="room-game-description" id="roomGameInfo">Abra uma sala para a turma participar pelo celular.</p>
          <div class="room-game-code" id="roomGameCode" hidden></div>
          <button class="room-game-button" id="roomGameAction" type="button" data-game-action="open">Abrir sala do desafio</button>
          <button class="room-game-link" id="copyGameLink" type="button" hidden>Copiar link da sala</button>
          <button class="room-game-close" id="closeGameButton" type="button" data-game-action="close" hidden>Encerrar sala</button>
        </section>

        <footer class="remote-footer">
          <button class="disconnect-button" id="disconnectButton" type="button">Desconectar controle</button>
          <span>CONTROLE DO JOGO · REDE LOCAL</span>
        </footer>
      </section>

      <p class="remote-status" id="remoteStatus" role="status" aria-live="polite"></p>
    </main>
    <script src="./remote.js"></script>
  </body>
</html>
